<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Faith Flyer"><meta name="theme-color" content="#7ec8f0">
<title>Faith Flyer</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d5ebf6;font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
.ui{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,30,10,.35)}
.ui.on{display:flex}
.card{background:
 radial-gradient(ellipse at 12% 0%,rgba(255,214,150,.55),transparent 46%),
 radial-gradient(ellipse at 100% 100%,rgba(170,206,164,.4),transparent 42%),
 radial-gradient(ellipse at 70% 20%,rgba(255,236,190,.5),transparent 40%),
 #f6edd4;
 border:5px solid #e6c98a;border-radius:32px;padding:22px 28px;max-width:min(880px,92vw);max-height:90vh;overflow:auto;box-shadow:0 12px 36px rgba(92,62,24,.28);text-align:center;color:#5a3b16}
h1{margin:.1em 0 .3em;font-size:clamp(30px,5vw,56px);color:#b5651d;font-weight:700}
h2{margin:.2em 0;font-size:clamp(24px,3.6vw,40px);color:#a85b24}
p{font-size:clamp(19px,2.5vw,28px);line-height:1.45;margin:.5em 0}
.verse{background:rgba(255,244,214,.85);border-radius:18px;padding:12px 18px;font-style:italic;border:3px dashed #e0b040}
.storyart{display:block;width:100%;max-height:26vh;object-fit:cover;object-position:center 42%;border-radius:22px;margin:0 0 8px;box-shadow:0 6px 16px rgba(90,60,20,.18)}
#story p{margin:.28em 0;font-size:clamp(17px,2.15vw,24px)}
#story h2{margin:.15em 0 .2em}
.shopplane{height:92px;width:auto;margin:4px auto 0;filter:drop-shadow(0 6px 0 rgba(120,80,30,.12))}
button{font:inherit;font-size:clamp(20px,2.6vw,30px);font-weight:bold;border:0;border-radius:999px;padding:16px 30px;margin:10px;min-height:72px;min-width:150px;background:#e7a23c;color:#fffaf0;box-shadow:0 6px 0 #c4842c;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #c4842c}
button.g{background:#7eae72;box-shadow:0 6px 0 #5c8a52}button.b{background:#6aa4c4;box-shadow:0 6px 0 #4d84a4}
button:disabled{background:#cfc3ae;box-shadow:0 6px 0 #b3a690;color:#fff}
.up{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:12px 0}
.up div{background:rgba(255,250,240,.72);border:3px solid #ead3a0;border-radius:22px;padding:10px}
.up b{font-size:clamp(20px,2.4vw,28px)}.pips{font-size:24px;color:#f5a623}
#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 16px;pointer-events:none}
#hud .pill{background:rgba(246,237,212,.92);border-radius:30px;padding:10px 20px;font-size:28px;font-weight:bold;color:#7a4e0e;border:3px solid #e6c98a}
#mute{pointer-events:auto;width:76px;height:76px;min-width:0;padding:0;font-size:36px;margin:0;border-radius:50%;background:rgba(246,237,212,.95);box-shadow:0 4px 0 #d7c093;color:#7a4e0e}
#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#f6edd4;border:3px solid #e6c98a;border-radius:22px;padding:12px 18px;font-size:20px;color:#5a3b16;display:none;max-width:90vw;z-index:9;text-align:center}
#hint button{min-height:50px;font-size:18px;padding:8px 16px;min-width:0}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Faith Flyer"><meta name="theme-color" content="#ffc928"></head><body>
<canvas id="c"></canvas>
<div id="hud"><span class="pill" id="bl">✨ 0</span><span class="pill" id="info"></span><button id="mute">🔊</button></div>
<div class="ui on" id="title"><div class="card"><h1>✈️ Faith Flyer</h1><p>Fly your little wooden plane through Bible stories!</p><p style="font-size:20px">Drag <b>toward the sky</b> to launch. Hold your finger <b>where you want to fly</b>. Collect glowing <b>blessings</b> ✨!</p><div id="levels"></div><button class="b" onclick="openShop()">🔧 Workshop</button></div></div>
<div class="ui" id="shop"><div class="card"><h2>🔧 Workshop</h2><img id="shopplane" class="shopplane" alt="Your plane"><p>Blessings: <b id="sbl"></b> ✨</p><div class="up" id="ups"></div><button class="g" onclick="show('title')">Done</button></div></div>
<div class="ui" id="story"><div class="card" id="storyc"></div></div>
<div class="ui" id="end"><div class="card" id="endc"></div></div>
<div id="hint">📱 Tip: tap <b>Share</b> <span style="font-size:24px">⬆️</span> then <b>Add to Home Screen</b> to play full-screen! <button onclick="hideHint()">OK</button></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');let W,H,S;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*d;C.height=H*d;X.setTransform(d,0,0,d,0,0);S=H/820}addEventListener('resize',rs);rs();
const $=id=>document.getElementById(id);
const IMG={plane:[]};
function loadArt(src){const im=new Image();im.src=src;return im}
IMG.eden=loadArt('art/bg-eden.webp');IMG.noah=loadArt('art/bg-noah.webp');IMG.tree=loadArt('art/end-tree.webp');IMG.ark=loadArt('art/end-ark.webp');
for(let i=1;i<=4;i++)IMG.plane.push(loadArt('art/plane-'+i+'.png'));
function ready(im){return !!(im&&im.complete&&im.naturalWidth)}
function planeStage(){const u=G.up,n=u.wings+u.tail+u.prop+u.sling;return n>=15?3:n>=9?2:n>=4?1:0}
// ---------- save ----------
let G=JSON.parse(localStorage.getItem('ff')||'null')||{b:0,up:{wings:0,tail:0,prop:0,sling:0},unl:1,muted:false,hint:false};
const save=()=>localStorage.setItem('ff',JSON.stringify(G));
const UP={wings:{n:'Wings',i:'🪽',d:'Glide farther'},tail:{n:'Tail',i:'🎏',d:'Steer smoother'},prop:{n:'Propeller',i:'🌀',d:'More flying power'},sling:{n:'Slingshot',i:'🏹',d:'Stronger launch'}};
const MAX=5,cost=l=>[15,35,70,120,200][l];
// ---------- levels ----------
const LV=[
{name:'Garden of Eden',len:5200,sky:['#8fd8ff','#e8fbff'],ground:'#5fbf4a',
 story:{t:'The Garden of Eden',p:['In the very beginning, God made everything! He made the sun, the stars, the seas, and every animal.','Then God made the first people, Adam and Eve. He gave them a beautiful garden called Eden to live in and take care of.','The garden was full of tall trees, sweet fruit, bright flowers, and friendly animals. God looked at everything He made and said it was very good!'],v:'"God saw all that he had made, and it was very good."',r:'Genesis 1:31'}},
{name:"Noah's Ark",len:6400,sky:['#7d9bb8','#d6e4ee'],ground:'#4a8fc9',
 story:{t:"Noah Builds the Ark",p:['Noah loved God and always tried to do what was right. One day God told Noah to build a very big boat called an ark.','Noah obeyed God! He built the ark just the way God said. Then the animals came, two by two: lions, giraffes, elephants, and birds.','Noah, his family, and all the animals went inside. When the rain came, God kept them safe and dry in the ark.','After the rain stopped, God put a beautiful rainbow in the sky. It was His promise to always care for the earth.'],v:'"I have set my rainbow in the clouds. It is my promise to the earth."',r:'Genesis 9:13 (kid-friendly)'}}];
const ANIMALS=['🦁','🦒','🐘','🐑','🐰','🐢','🦓','🐻'];
// ---------- audio ----------
let AC;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC}
function tone(f,d=.12,type='sine',v=.15,slide=0,delay=0){if(G.muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SFX={coin:()=>{tone(880,.08,'triangle');tone(1320,.15,'triangle',.12,0,.07)},launch:()=>tone(200,.5,'sawtooth',.08,700),bump:()=>tone(160,.25,'sine',.15,90),
pair:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.15,'triangle',.12,0,i*.08)),win:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.13,0,i*.14)),click:()=>tone(600,.05,'square',.05)};
let engine;function engineOn(on){const a=ac();if(!a)return;if(on&&!engine&&!G.muted){const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=70;g.gain.value=.025;o.connect(g).connect(a.destination);o.start();engine={o,g}}if(!on&&engine){engine.o.stop();engine=null}}
$('mute').onclick=e=>{e.stopPropagation();G.muted=!G.muted;save();$('mute').textContent=G.muted?'🔇':'🔊';if(G.muted)engineOn(false);else{SFX.click();if(st=='fly'&&P.fuel>0)engineOn(true)}};$('mute').textContent=G.muted?'🔇':'🔊';
// ---------- UI ----------
function show(id){document.querySelectorAll('.ui').forEach(e=>e.classList.remove('on'));if(id)$(id).classList.add('on');if(id=='title')renderTitle();$('bl').textContent='✨ '+G.b}
function renderTitle(){$('levels').innerHTML=LV.map((l,i)=>`<button class="g" ${i<G.unl?'':'disabled'} onclick="startLevel(${i})">${i<G.unl?'▶':'🔒'} ${i+1}. ${l.name}</button>`).join('<br>')}
function openShop(){SFX.click();$('shopplane').src='art/plane-'+(planeStage()+1)+'.png';$('sbl').textContent=G.b;$('ups').innerHTML=Object.keys(UP).map(k=>{const l=G.up[k],c=cost(l);return`<div><b>${UP[k].i} ${UP[k].n}</b><br><span style="font-size:18px">${UP[k].d}</span><br><span class="pips">${'★'.repeat(l)}${'☆'.repeat(MAX-l)}</span><br>${l>=MAX?'<b>MAX!</b>':`<button ${G.b>=c?'':'disabled'} onclick="buy('${k}')">${c} ✨</button>`}</div>`}).join('');show('shop')}
function buy(k){const c=cost(G.up[k]);if(G.b>=c&&G.up[k]<MAX){G.b-=c;G.up[k]++;save();SFX.pair();openShop()}}
// ---------- game state ----------
let st='menu',lv=0,P,cam=0,items=[],clouds=[],deco=[],parts=[],runB=0,pairs=0,t=0,aim=null,touch=null,pid=null;
const keys={up:false,down:false};
const DEG=Math.PI/180,MIN_AIM=10*DEG,MAX_AIM=65*DEG,DEF_AIM=30*DEG;
function startLevel(i){ac();SFX.click();lv=i;show(null);aim=null;touch=null;
 P={x:120,y:groundY()-170,vx:0,vy:0,ang:-DEF_AIM,fuel:1,steer:0,air:0};cam=0;runB=0;pairs=0;items=[];clouds=[];deco=[];parts=[];
 const L=LV[i];
 layBlessings(L);
 for(let x=-400;x<L.len+1200;x+=60+Math.random()*120)deco.push({x,s:.6+Math.random()*.8,t:Math.floor(Math.random()*3)});
 st='aim';$('info').textContent=L.name}
const groundY=()=>H/S-70;
// Natural early glide: climbs to mid-sky, then a slow sink. Items follow it.
function blessY(x){const rise=Math.min(1,Math.max(0,(x-120)/420));return 578-rise*112+Math.max(0,x-700)*0.085}
function layBlessings(L){const early=L.len*0.4;let n=0;
 for(let x=380;x<L.len-520;x+=x<early?105:175){const wave=Math.sin(n*0.85)*22+Math.sin(n*0.37)*10;
  let px=x;if(n%3==0)px-=px%3;else if(px%3==0)px+=1;
  const y=Math.max(140,Math.min(groundY()-100,blessY(px)+wave));
  items.push({x:px,y,k:'b',got:0});
  if(x<early&&n%2==0)items.push({x:px+40,y:Math.max(120,y-46),k:'b',got:0});
  n++}
 if(lv==1){let ai=0;for(let x=820;x<L.len-780;x+=460){const y=Math.max(160,blessY(x)-8);
  items.push({x,y,k:'a',a:ANIMALS[ai%ANIMALS.length],got:0});ai++;
  clouds.push({x:x+160,y:Math.max(90,blessY(x)-310),r:52+(ai%3)*8,hit:0})}}}
// Launch follows the drag (toward the sky), never the opposite pull-back.
function aimShot(a){const sling=G.up.sling;let ang=DEF_AIM,pull=.72;
 if(a){const dx=(a.x-a.x0)/S,dy=(a.y-a.y0)/S,len=Math.hypot(dx,dy);
  if(len>26){if(dx>8)ang=Math.atan2(-dy,dx);else ang=dy<0?MAX_AIM:MIN_AIM;
   if(ang<MIN_AIM)ang=MIN_AIM;if(ang>MAX_AIM)ang=MAX_AIM;pull=Math.max(.72,Math.min(1,len/220))}}
 const pow=(4.05+sling*0.52)*(0.9+0.1*pull);
 return {ang,vx:pow*Math.cos(ang)+0.55+sling*0.2,vy:-(pow*Math.sin(ang)+0.7)}}
function stepFlight(p,u,cmd,k){const powered=p.fuel>0;const fuelSecs=9.2+u.prop*1.25;
 if(powered){p.fuel-=k/60/fuelSecs;if(p.fuel<0)p.fuel=0}
 let cruise=(powered?0.36:1.15)-u.wings*0.06;
 p.steer=(p.steer||0)+(cmd-(p.steer||0))*Math.min((0.038+u.tail*0.012)*k,0.45);
 cruise-=p.steer*((powered?0.7:0.28)+u.tail*0.05);
 const lo=powered?-0.55:0.72-u.wings*0.07;
 if(cruise<lo)cruise=lo;if(cruise>2.35)cruise=2.35;
 p.vy+=(cruise-p.vy)*0.016*k;
 if(powered)p.vx+=(0.003+u.prop*0.0055)*k;
 p.vx+=u.wings*0.0045*k;p.vx*=1-0.0012*k;
 const minVx=2.55+u.wings*0.18+(powered?0.25:0);
 const maxVx=4.15+u.wings*0.22+u.prop*0.08+u.sling*0.05;
 if(p.vx<minVx)p.vx=minVx;if(p.vx>maxVx)p.vx=maxVx;
 const maxUp=Math.tan(58*DEG)*p.vx,maxDn=Math.tan(20*DEG)*p.vx;
 if(p.vy<-maxUp)p.vy=-maxUp;if(p.vy>maxDn)p.vy=maxDn;
 if(p.y<84){p.y=84;if(p.vy<0.2)p.vy=0.2}
 p.x+=p.vx*k;p.y+=p.vy*k}
function launchFrom(a){const s=aimShot(a);P.vx=s.vx;P.vy=s.vy;P.fuel=1;P.steer=0;P.air=0;P.ang=-s.ang;st='fly';aim=null;SFX.launch();engineOn(true);if(!G.sawLaunch){G.sawLaunch=true;save()}}
// ---------- input ----------
function down(e){if(pid!=null)return;if(e.target.closest&&e.target.closest('button,.ui.on'))return;if(st!='aim'&&st!='fly')return;pid=e.pointerId;ac();
 if(st=='aim')aim={x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY};else touch={x:e.clientX,y:e.clientY}}
function move(e){if(e.pointerId!==pid)return;if(aim){aim.x=e.clientX;aim.y=e.clientY}if(touch){touch.x=e.clientX;touch.y=e.clientY}}
function up(e){if(e.pointerId!==pid)return;pid=null;if(aim&&st=='aim')launchFrom(aim);aim=null;touch=null}
addEventListener('pointerdown',down);addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.key=='ArrowUp'){keys.up=true;e.preventDefault()}if(e.key=='ArrowDown'){keys.down=true;e.preventDefault()}if(st=='aim'&&e.key==' '){e.preventDefault();launchFrom(null)}});
addEventListener('keyup',e=>{if(e.key=='ArrowUp')keys.up=false;if(e.key=='ArrowDown')keys.down=false});
// ---------- update ----------
function update(dt){if(dt==null)dt=1/60;const k=dt*60;t+=k;if(st!='fly')return;const u=G.up,L=LV[lv],gy=groundY();
 let cmd=0;
 if(touch){cmd=Math.max(-1,Math.min(1,(P.y-touch.y/S)/300));if(!G.sawSteer){G.sawSteer=true;save()}}
 else if(keys.up&&!keys.down)cmd=1;else if(keys.down&&!keys.up)cmd=-1;
 for(const c of clouds){const dx=P.x-c.x,dy=P.y-c.y;if(dx*dx+dy*dy<c.r*c.r){P.vy+=0.04*k;P.vx*=1-0.004*k;if(!c.hit){c.hit=1;SFX.bump()}}else c.hit=0}
 const hadFuel=P.fuel>0;stepFlight(P,u,cmd,k);if(hadFuel&&P.fuel<=0)engineOn(false);P.air+=dt;
 for(const it of items)if(!it.got&&Math.abs(it.x-P.x)<50&&Math.abs(it.y-P.y)<50){it.got=1;if(it.k=='b'){runB++;SFX.coin()}else{runB+=10;pairs++;SFX.pair()}for(let n=0;n<10;n++)parts.push({x:it.x,y:it.y,vx:Math.random()*6-3,vy:Math.random()*6-3,l:30})}
 P.ang=Math.atan2(P.vy,P.vx);cam=P.x-W/S*.3;
 parts=parts.filter(p=>(p.x+=p.vx,p.y+=p.vy,--p.l>0));
 if(P.y>gy-18){P.y=gy-18;if(P.x>L.len-350)finish(true);else finish(false)}
 else if(P.x>L.len+250)finish(true);
 $('bl').textContent='✨ '+(G.b+runB)}
function finish(win){st='done';aim=null;touch=null;pid=null;engineOn(false);G.b+=runB;if(!G.sawSteer){G.sawSteer=true;save()}
 if(win){SFX.win();if(G.unl<lv+2&&lv+1<LV.length)G.unl=lv+2;save();const s=LV[lv].story;
  setTimeout(()=>{const pic=lv?'art/end-ark.webp':'art/end-tree.webp',alt=lv?"Noah's ark with the animals, a rainbow, and a dove":'The glowing Tree of Life in a peaceful garden';$('storyc').innerHTML=`<img class="storyart" src="${pic}" alt="${alt}"><h2>📖 ${s.t}</h2>${s.p.map(x=>`<p>${x}</p>`).join('')}<p class="verse">${s.v}<br><b>— ${s.r}</b></p><p>You earned <b>${runB}</b> blessings ✨${lv==1?` and found <b>${pairs}</b> animal pairs!`:''}</p><button class="g" onclick="show('title')">${lv+1<LV.length?'Next Adventure ▶':'Home 🏠'}</button><button class="b" onclick="openShop()">🔧 Workshop</button>`;show('story')},900)}
 else{save();SFX.bump();setTimeout(()=>{const pct=Math.round(Math.min(P.x/LV[lv].len,1)*100);const head=pct<36?'Bumpy landing! Try again!':pct<45?'Nice flying!':'Great flight!';const note=pct<36?'Drag toward the sky, then hold your finger up where you want to fly!':'Upgrade your plane in the Workshop to fly farther!';$('endc').innerHTML=`<h2>${head}</h2><p>You flew <b>${pct}%</b> of the way and gathered <b>${runB}</b> blessings ✨</p><p>${note}</p><button class="g" onclick="startLevel(${lv})">Try Again 🔁</button><button class="b" onclick="openShop()">🔧 Workshop</button><button onclick="show('title')">🏠</button>`;show('end')},700)}}
// ---------- draw ----------
function heart(x,y,r){const g=X.createRadialGradient(x,y-r*.1,r*.2,x,y,r*2.8);g.addColorStop(0,'rgba(255,220,120,.9)');g.addColorStop(.45,'rgba(255,186,50,.28)');g.addColorStop(1,'rgba(255,170,40,0)');X.fillStyle=g;X.beginPath();X.arc(x,y,r*2.8,0,7);X.fill();
 X.fillStyle='#e7a52e';X.beginPath();X.moveTo(x,y+r*.9);X.bezierCurveTo(x-r*1.55,y+r*.15,x-r*1.2,y-r*1.2,x,y-r*.35);X.bezierCurveTo(x+r*1.2,y-r*1.2,x+r*1.55,y+r*.15,x,y+r*.9);X.fill();
 X.fillStyle='rgba(255,228,150,.8)';X.beginPath();X.arc(x-r*.32,y-r*.28,r*.26,0,7);X.fill();
 X.fillStyle='rgba(255,250,220,.95)';for(let i=0;i<3;i++){const a=t*.07+i*2.1+x*.01;X.fillRect(x+Math.cos(a)*r*1.35-1,y+Math.sin(a*1.4)*r*1.15-1,2.4,2.4)}}
function sparkle(x,y,r){const g=X.createRadialGradient(x,y,0,x,y,r*2.2);g.addColorStop(0,'rgba(255,236,170,.95)');g.addColorStop(1,'rgba(255,200,60,0)');X.fillStyle=g;X.beginPath();X.arc(x,y,r*2.2,0,7);X.fill()}
function cloud(x,y,r,col){X.fillStyle=col;for(const[a,b,c]of[[0,0,1],[-.8,.2,.7],[.8,.2,.7],[-.4,-.4,.7],[.4,-.35,.75]]){X.beginPath();X.arc(x+a*r,y+b*r,c*r,0,7);X.fill()}}
function plane(){const im=IMG.plane[planeStage()];X.save();X.translate(P.x-cam,P.y);X.rotate(Math.max(-.6,Math.min(.6,P.ang||0)));
 if(ready(im)){const w=164,h=w*im.height/im.width;X.drawImage(im,-w*.48,-h*.52,w,h);
  if(P.fuel>0&&st=='fly'){X.save();X.translate(w*.40,-h*.02);X.scale(.3,1);X.rotate(t*.9);X.fillStyle='rgba(110,72,28,.5)';X.fillRect(-2.5,-15,5,30);X.restore()}
  X.restore();return}
 X.restore();
